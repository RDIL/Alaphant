org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Point this at a Charles 5 install directory containing charles.jar and its dependency
# jars, if auto-detection does not find yours. On macOS the default is
# /Applications/Charles.app/Contents/Java.
# alaphant.charlesInstall=/path/to/Charles/Contents/Java

# The Charles install the mappings were last generated against, used by `matchVersions` to carry
# intermediary IDs across an upgrade. Keep a copy of the install before upgrading -- matching is
# jar-to-jar, and the ledger alone does not describe the old version well enough to stand in for it.
alaphant.previousCharlesInstall=/Users/reece/Applications/Charles-5.0.3.app/Contents/Java
